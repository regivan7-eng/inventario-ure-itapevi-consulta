name: Conferir página publicada
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/conferir-publicacao.yml']
permissions:
  contents: read
jobs:
  conferir:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --no-save --ignore-scripts playwright-core@1.56.1
      - run: node sync/check-live.cjs
