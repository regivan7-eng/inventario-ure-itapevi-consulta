name: Testar candidato com base central
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  testar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node sync/candidate-v2.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: candidato-base-central
          path: candidate/
          retention-days: 3
